<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Solutions - Edison Business Partner</title>
    
    <!-- Firebase versione BUNDLED - funziona anche offline -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-database-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-auth-compat.min.js"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f9f4; }
        .loading-screen { 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            background: linear-gradient(135deg, #f0f9f4 0%, #c8e6c9 100%); 
        }
        .loading-screen h1 { color: #2E7D32; margin-bottom: 20px; }
        .loading-screen p { color: #666; margin: 10px 0; }
        .error-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fee;
            padding: 20px;
        }
        .error-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            border: 3px solid #f44336;
        }
        .error-card h2 { color: #f44336; margin-bottom: 20px; }
        .error-card pre { 
            background: #000; 
            color: #0f0; 
            padding: 15px; 
            border-radius: 8px; 
            overflow-x: auto; 
            margin: 15px 0;
            font-size: 12px;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-green:hover { background: #45a049; }
        .btn-white { background: white; color: #4CAF50; border: 2px solid #4CAF50; }
        .btn-white:hover { background: #f0f9f4; }
        .btn-red { background: #f44336; color: white; }
        .btn-gray { background: #ddd; color: #666; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 4px solid #4CAF50; }
        .input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; }
        .input:focus { outline: none; border-color: #4CAF50; }
        .label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #333; }
        .mb { margin-bottom: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .section-title { font-size: 18px; font-weight: 700; color: #2E7D32; margin: 24px 0 16px 0; padding-bottom: 8px; border-bottom: 2px solid #81C784; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; overflow-y: auto; }
        .modal-content { background: white; border-radius: 16px; padding: 24px; width: 95%; max-width: 900px; max-height: 90vh; overflow-y: auto; margin: 20px 0; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-right: 8px; }
        .stato-calda { background: #FEF3C7; color: #92400E; }
        .stato-tiepida { background: #FCE7F3; color: #831843; }
        .stato-fredda { background: #DBEAFE; color: #1E40AF; }
        .stato-ko { background: #FEE2E2; color: #991B1B; }
        .stato-ok { background: #D1FAE5; color: #065F46; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f0f9f4 0%, #c8e6c9 100%); }
        .login-card { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(76, 175, 80, 0.3); padding: 40px; max-width: 400px; width: 100%; }
        .logo { background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%); padding: 20px; border-radius: 12px; color: white; text-align: center; margin-bottom: 24px; }
        .logo h2 { font-size: 24px; margin: 0; font-weight: 700; }
        .logo p { font-size: 13px; margin: 8px 0 0 0; opacity: 0.95; }
        .header { background: white; border-bottom: 3px solid #4CAF50; padding: 16px; margin-bottom: 24px; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .checkbox-item { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #f5f5f5; border-radius: 6px; cursor: pointer; }
        .checkbox-item input[type="checkbox"] { cursor: pointer; }
        .checkbox-item:hover { background: #e8f5e9; }
        textarea { resize: vertical; font-family: Arial, sans-serif; min-height: 80px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th { background: #4CAF50; color: white; padding: 14px; text-align: left; font-size: 13px; font-weight: 700; }
        td { padding: 14px; border-top: 1px solid #ddd; }
        tr:hover { background: #f9f9f9; }
        @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <h1>⚡ Energy Solutions</h1>
            <p>Caricamento in corso...</p>
            <p style="font-size: 12px; color: #999; margin-top: 20px;">Se questa schermata persiste, controlla la console (F12)</p>
        </div>
    </div>
    
    <script>
        // Log di debug
        console.log('🚀 Script iniziato');
        
        // Verifica Firebase
        setTimeout(() => {
            if (typeof firebase === 'undefined') {
                document.getElementById('root').innerHTML = `
                    <div class="error-screen">
                        <div class="error-card">
                            <h2>❌ Errore: Firebase non caricato</h2>
                            <p><strong>Il browser non riesce a caricare Firebase.</strong></p>
                            
                            <h3 style="margin-top: 20px;">Possibili cause:</h3>
                            <ul style="margin: 15px 0; padding-left: 20px;">
                                <li>Estensioni browser (AdBlock, Privacy Badger, etc.)</li>
                                <li>Firewall aziendale che blocca cdnjs.cloudflare.com</li>
                                <li>Connessione internet instabile</li>
                            </ul>
                            
                            <h3 style="margin-top: 20px;">Soluzioni:</h3>
                            <ol style="margin: 15px 0; padding-left: 20px;">
                                <li>Disattiva temporaneamente AdBlock/Privacy Badger</li>
                                <li>Prova con un altro browser (Chrome, Firefox, Edge)</li>
                                <li>Prova in modalità incognito</li>
                                <li>Verifica la connessione internet</li>
                                <li>Contatta l'IT se sei in rete aziendale</li>
                            </ol>
                            
                            <button class="btn btn-green" onclick="window.location.reload()" style="margin-top: 20px;">
                                🔄 Riprova
                            </button>
                            
                            <h3 style="margin-top: 30px;">Debug Info:</h3>
                            <pre>Firebase SDK: NON CARICATO
User Agent: ${navigator.userAgent}
URL: ${window.location.href}</pre>
                        </div>
                    </div>
                `;
            } else {
                console.log('✅ Firebase caricato, inizializzo app...');
            }
        }, 2000);
    </script>
    
    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyAPdXkLXzz4zjScQX3_buEXGi2OytRfH2o",
            authDomain: "bu-progetti-speciali.firebaseapp.com",
            databaseURL: "https://bu-progetti-speciali-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bu-progetti-speciali",
            storageBucket: "bu-progetti-speciali.firebasestorage.app",
            messagingSenderId: "86623187511",
            appId: "1:86623187511:web:2a093d51719b458b4ec5b2"
        };

        const { useState, useEffect } = React;

        const TIPOLOGIE_CLIENTE = ['P.A.', 'ETS NON COMMERCIALE', 'ETS COMMERCIALE', 'PRIVATO PMI', 'PRIVATO NON PMI', 'AZIENDA AGRICOLA'];
        const TIPOLOGIE_INTERVENTO = {
            'esco': { label: 'ESCO', voci: ['FTV', 'ILLUMINAZIONE', 'CENTRALE TERMICA', 'INFISSI', 'ISOLAMENTO', 'IMPIANTI INTERNI', 'BATTERIA DI ACCUMULO'] },
            'conto_termico': { label: 'CONTO TERMICO 3.0', voci: ['FTV', 'ILLUMINAZIONE', 'CENTRALE TERMICA', 'INFISSI', 'ISOLAMENTO', 'IMPIANTI INTERNI', 'BATTERIA DI ACCUMULO', 'NZeb'] },
            'industria_5': { label: 'INDUSTRIA 5.0', voci: ['FTV', 'IMPIANTI INTERNI'] },
            'agrisolare': { label: 'AGRISOLARE 2026', voci: ['FTV', 'ACCUMULO', 'COLONNETTA RICARICA', 'INTERVENTI IN COPERTURA'] },
            'cratere_2016': { label: 'CRATERE 2016', voci: ['DEMOLIZIONE E RICOSTRUZIONE', 'RISTRUTTURAZIONE', 'INTERVENTO SOLO IMPIANTI'] },
            'cratere_2009': { label: 'CRATERE 2009', voci: ['DEMOLIZIONE E RICOSTRUZIONE', 'RISTRUTTURAZIONE', 'INTERVENTO SOLO IMPIANTI'] },
            'privato': { label: 'PRIVATO', voci: [] }
        };
        const STATI = ['CALDA', 'TIEPIDA', 'FREDDA', 'KO', 'OK'];
        const CONTRATTUALIZZAZIONE = ['entro 1 mese', 'entro 3 mesi', 'entro 6 mesi', 'entro 12 mesi'];
        const TIPO_INTERVENTO = ['SINGOLO', 'MULTI INTERVENTO'];
        const RUOLI = {
            'admin': 'Amministratore',
            'agenzia': 'Agenzia',
            'diretto': 'Diretto',
            'interno': 'Interno',
            'visualizzatore': 'Visualizzatore'
        };

        function App() {
            const [initComplete, setInitComplete] = useState(false);
            const [authUser, setAuthUser] = useState(null);
            const [user, setUser] = useState(null);
            const [users, setUsers] = useState([]);
            const [opps, setOpps] = useState([]);
            const [showLogin, setShowLogin] = useState(true);
            const [showForm, setShowForm] = useState(false);
            const [showUserForm, setShowUserForm] = useState(false);
            const [editOpp, setEditOpp] = useState(null);
            const [editUser, setEditUser] = useState(null);
            const [login, setLogin] = useState({ username: '', password: '', remember: false });
            const [userForm, setUserForm] = useState({ username: '', password: '', name: '', role: 'agenzia' });
            const [filters, setFilters] = useState({ 
                utente: '', 
                stato: '', 
                tipologiaCliente: '', 
                tipologiaIntervento: '', 
                search: '' 
            });
            const [showDescModal, setShowDescModal] = useState(false);
            const [selectedDesc, setSelectedDesc] = useState('');
            const [error, setError] = useState(null);
            const [dbRef, setDbRef] = useState(null);

            useEffect(() => {
                try {
                    console.log('🚀 Inizializzazione Firebase...');
                    
                    if (typeof firebase === 'undefined') {
                        throw new Error('Firebase SDK non caricato. Verifica la connessione e riprova.');
                    }
                    
                    const app = firebase.initializeApp(firebaseConfig);
                    const db = firebase.database();
                    setDbRef(db);
                    console.log('✅ Firebase inizializzato');

                    const unsubscribe = firebase.auth().onAuthStateChanged(async (firebaseUser) => {
                        console.log('🔐 Auth state changed:', firebaseUser?.uid);
                        
                        if (firebaseUser) {
                            setAuthUser(firebaseUser);
                            
                            try {
                                const userSnapshot = await db.ref(`users/${firebaseUser.uid}`).once('value');
                                const userData = userSnapshot.val();
                                
                                if (userData) {
                                    setUser({ ...userData, uid: firebaseUser.uid });
                                    setShowLogin(false);
                                    loadData(db, { ...userData, uid: firebaseUser.uid });
                                } else {
                                    console.error('❌ Utente non trovato nel database');
                                    setError('Utente non trovato nel database');
                                    await firebase.auth().signOut();
                                }
                            } catch (err) {
                                console.error('❌ Errore caricamento utente:', err);
                                setError(`Errore caricamento utente: ${err.message}`);
                                await firebase.auth().signOut();
                            }
                        } else {
                            setAuthUser(null);
                            setUser(null);
                            setShowLogin(true);
                        }
                        
                        setInitComplete(true);
                    });

                    return () => unsubscribe();
                } catch (err) {
                    console.error('❌ Errore inizializzazione Firebase:', err);
                    setError(err.message);
                    setInitComplete(true);
                }
            }, []);

            const loadData = async (db, currentUser) => {
                try {
                    console.log('📊 Caricamento dati...');
                    
                    const oppsSnapshot = await db.ref('opportunita').once('value');
                    const oppsData = [];
                    oppsSnapshot.forEach(child => {
                        oppsData.push({ id: child.key, ...child.val() });
                    });
                    
                    console.log(`✅ Caricate ${oppsData.length} opportunità`);
                    setOpps(oppsData);

                    if (currentUser.role === 'admin') {
                        const usersSnapshot = await db.ref('users').once('value');
                        const usersData = [];
                        usersSnapshot.forEach(child => {
                            usersData.push({ uid: child.key, ...child.val() });
                        });
                        console.log(`✅ Caricati ${usersData.length} utenti`);
                        setUsers(usersData);
                    }
                } catch (err) {
                    console.error('❌ Errore caricamento dati:', err);
                    setError(`Errore caricamento dati: ${err.message}`);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setError(null);
                
                try {
                    console.log('🔑 Tentativo login...');
                    
                    const usersSnapshot = await dbRef.ref('users').once('value');
                    let foundUser = null;
                    
                    usersSnapshot.forEach(child => {
                        const userData = child.val();
                        if (userData.username === login.username && userData.password === login.password) {
                            foundUser = { uid: child.key, ...userData };
                        }
                    });

                    if (!foundUser) {
                        throw new Error('Username o password errati');
                    }

                    const email = `${login.username}@energy-solutions.local`;
                    
                    try {
                        await firebase.auth().signInWithEmailAndPassword(email, login.password);
                    } catch (authError) {
                        if (authError.code === 'auth/user-not-found') {
                            console.log('Creating new auth user...');
                            await firebase.auth().createUserWithEmailAndPassword(email, login.password);
                        } else if (authError.code === 'auth/wrong-password') {
                            throw new Error('Password errata');
                        } else {
                            throw authError;
                        }
                    }

                    console.log('✅ Login riuscito');
                } catch (err) {
                    console.error('❌ Errore login:', err);
                    setError(err.message);
                }
            };

            const handleLogout = async () => {
                try {
                    await firebase.auth().signOut();
                    setUser(null);
                    setOpps([]);
                    setUsers([]);
                    setShowLogin(true);
                } catch (err) {
                    console.error('❌ Errore logout:', err);
                    setError(err.message);
                }
            };

            const saveOpp = async (e) => {
                e.preventDefault();
                setError(null);
                
                try {
                    const formData = new FormData(e.target);
                    const data = Object.fromEntries(formData);
                    const vociIntervento = formData.getAll('vociIntervento');
                    data.vociIntervento = vociIntervento;
                    data.creatoIl = editOpp ? editOpp.creatoIl : Date.now();
                    data.modificatoIl = Date.now();
                    data.creatorId = user.uid;
                    data.creatorName = user.name;
                    
                    if (editOpp) {
                        await dbRef.ref(`opportunita/${editOpp.id}`).update(data);
                    } else {
                        await dbRef.ref('opportunita').push(data);
                    }
                    
                    setShowForm(false);
                    setEditOpp(null);
                    loadData(dbRef, user);
                } catch (err) {
                    console.error('❌ Errore salvataggio:', err);
                    setError(err.message);
                }
            };

            const deleteOpp = async (id) => {
                if (!confirm('Sei sicuro di voler eliminare questa opportunità?')) return;
                
                try {
                    await dbRef.ref(`opportunita/${id}`).remove();
                    loadData(dbRef, user);
                } catch (err) {
                    console.error('❌ Errore eliminazione:', err);
                    setError(err.message);
                }
            };

            const saveUser = async (e) => {
                e.preventDefault();
                setError(null);
                
                try {
                    const email = `${userForm.username}@energy-solutions.local`;
                    
                    if (editUser) {
                        await dbRef.ref(`users/${editUser.uid}`).update({
                            name: userForm.name,
                            username: userForm.username,
                            role: userForm.role,
                            password: userForm.password
                        });
                    } else {
                        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, userForm.password);
                        
                        await dbRef.ref(`users/${userCredential.user.uid}`).set({
                            name: userForm.name,
                            username: userForm.username,
                            role: userForm.role,
                            password: userForm.password,
                            createdAt: Date.now()
                        });
                        
                        await firebase.auth().updateCurrentUser(authUser);
                    }
                    
                    setShowUserForm(false);
                    setEditUser(null);
                    setUserForm({ username: '', password: '', name: '', role: 'agenzia' });
                    loadData(dbRef, user);
                } catch (err) {
                    console.error('❌ Errore salvataggio utente:', err);
                    setError(err.message);
                }
            };

            const deleteUser = async (uid) => {
                if (!confirm('Sei sicuro di voler eliminare questo utente?')) return;
                
                try {
                    await dbRef.ref(`users/${uid}`).remove();
                    loadData(dbRef, user);
                } catch (err) {
                    console.error('❌ Errore eliminazione utente:', err);
                    setError(err.message);
                }
            };

            const filteredOpps = opps.filter(opp => {
                if (user && user.role === 'agenzia' && opp.creatorId !== user.uid) return false;
                if (user && user.role === 'diretto' && opp.creatorId !== user.uid) return false;
                if (filters.utente && opp.creatorId !== filters.utente) return false;
                if (filters.stato && opp.stato !== filters.stato) return false;
                if (filters.tipologiaCliente && opp.tipologiaCliente !== filters.tipologiaCliente) return false;
                if (filters.tipologiaIntervento && opp.tipologiaIntervento !== filters.tipologiaIntervento) return false;
                if (filters.search) {
                    const s = filters.search.toLowerCase();
                    return (
                        opp.cliente?.toLowerCase().includes(s) ||
                        opp.comune?.toLowerCase().includes(s) ||
                        opp.descrizioneIntervento?.toLowerCase().includes(s)
                    );
                }
                return true;
            });

            if (!initComplete) {
                return (
                    <div className="loading-screen">
                        <h1>⚡ Energy Solutions</h1>
                        <div style={{fontSize: '48px', marginBottom: '20px'}}>⏳</div>
                        <p>Inizializzazione...</p>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="error-screen">
                        <div className="error-card">
                            <h2>⚠️ Errore</h2>
                            <p>{error}</p>
                            <button className="btn btn-green" onClick={() => window.location.reload()} style={{marginTop: '10px'}}>
                                Ricarica Pagina
                            </button>
                        </div>
                    </div>
                );
            }

            if (showLogin) {
                return (
                    <div className="login-container">
                        <div className="login-card">
                            <div className="logo">
                                <h2>⚡ Energy Solutions</h2>
                                <p>Edison Business Partner</p>
                            </div>
                            <form onSubmit={handleLogin}>
                                <div className="mb">
                                    <label className="label">Username</label>
                                    <input 
                                        className="input" 
                                        value={login.username} 
                                        onChange={e => setLogin({...login, username: e.target.value})} 
                                        required 
                                        autoFocus
                                    />
                                </div>
                                <div className="mb">
                                    <label className="label">Password</label>
                                    <input 
                                        type="password" 
                                        className="input" 
                                        value={login.password} 
                                        onChange={e => setLogin({...login, password: e.target.value})} 
                                        required 
                                    />
                                </div>
                                <div className="mb" style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                    <input 
                                        type="checkbox" 
                                        checked={login.remember} 
                                        onChange={e => setLogin({...login, remember: e.target.checked})}
                                        id="remember"
                                    />
                                    <label htmlFor="remember" style={{margin: 0, cursor: 'pointer'}}>Ricordami</label>
                                </div>
                                <button type="submit" className="btn btn-green" style={{width: '100%'}}>
                                    Accedi
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                            <div>
                                <h1 style={{color: '#2E7D32', fontSize: '28px'}}>⚡ Energy Solutions</h1>
                                <p style={{color: '#666', marginTop: '4px'}}>Benvenuto, {user.name} ({RUOLI[user.role]})</p>
                            </div>
                            <button className="btn btn-red" onClick={handleLogout}>Esci</button>
                        </div>
                    </div>

                    <div className="card">
                        <div className="grid-3">
                            <div>
                                <label className="label">Cerca</label>
                                <input 
                                    className="input" 
                                    placeholder="Cliente, Comune, Descrizione..." 
                                    value={filters.search}
                                    onChange={e => setFilters({...filters, search: e.target.value})}
                                />
                            </div>
                            <div>
                                <label className="label">Stato</label>
                                <select className="input" value={filters.stato} onChange={e => setFilters({...filters, stato: e.target.value})}>
                                    <option value="">Tutti</option>
                                    {STATI.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="label">Tipologia Cliente</label>
                                <select className="input" value={filters.tipologiaCliente} onChange={e => setFilters({...filters, tipologiaCliente: e.target.value})}>
                                    <option value="">Tutte</option>
                                    {TIPOLOGIE_CLIENTE.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                            </div>
                        </div>
                        <div style={{marginTop: '16px'}}>
                            <button 
                                className="btn btn-green" 
                                onClick={() => {
                                    setShowForm(true);
                                    setEditOpp(null);
                                }}
                            >
                                + Nuova Opportunità
                            </button>
                            {user.role === 'admin' && (
                                <button 
                                    className="btn btn-white" 
                                    onClick={() => {
                                        setShowUserForm(true);
                                        setEditUser(null);
                                        setUserForm({ username: '', password: '', name: '', role: 'agenzia' });
                                    }}
                                    style={{marginLeft: '10px'}}
                                >
                                    👥 Gestisci Utenti
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="card">
                        <h2 style={{marginBottom: '16px'}}>📊 Opportunità ({filteredOpps.length})</h2>
                        <div style={{overflowX: 'auto'}}>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Cliente</th>
                                        <th>Comune</th>
                                        <th>Tipologia Cliente</th>
                                        <th>Tipologia Intervento</th>
                                        <th>Stato</th>
                                        <th>Importo €</th>
                                        <th>Creato da</th>
                                        <th>Azioni</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredOpps.length === 0 ? (
                                        <tr><td colSpan="8" style={{textAlign: 'center', padding: '40px'}}>Nessuna opportunità trovata</td></tr>
                                    ) : (
                                        filteredOpps.map(opp => (
                                            <tr key={opp.id}>
                                                <td><strong>{opp.cliente}</strong></td>
                                                <td>{opp.comune}</td>
                                                <td>{opp.tipologiaCliente}</td>
                                                <td>{TIPOLOGIE_INTERVENTO[opp.tipologiaIntervento]?.label}</td>
                                                <td>
                                                    <span className={`badge stato-${opp.stato.toLowerCase()}`}>
                                                        {opp.stato}
                                                    </span>
                                                </td>
                                                <td>{opp.importoPresunto ? `€ ${parseInt(opp.importoPresunto).toLocaleString()}` : '-'}</td>
                                                <td>{opp.creatorName}</td>
                                                <td>
                                                    <button 
                                                        className="btn btn-white" 
                                                        style={{padding: '6px 12px', marginRight: '4px'}}
                                                        onClick={() => {
                                                            setEditOpp(opp);
                                                            setShowForm(true);
                                                        }}
                                                    >
                                                        ✏️
                                                    </button>
                                                    {(user.role === 'admin' || opp.creatorId === user.uid) && (
                                                        <button 
                                                            className="btn btn-red" 
                                                            style={{padding: '6px 12px'}}
                                                            onClick={() => deleteOpp(opp.id)}
                                                        >
                                                            🗑️
                                                        </button>
                                                    )}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {showForm && (
                        <div className="modal" onClick={() => { setShowForm(false); setEditOpp(null); }}>
                            <div className="modal-content" onClick={e => e.stopPropagation()}>
                                <h2 style={{marginBottom: '20px', color: '#2E7D32'}}>
                                    {editOpp ? '✏️ Modifica' : '➕ Nuova'} Opportunità
                                </h2>
                                <form onSubmit={saveOpp}>
                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Cliente *</label>
                                            <input name="cliente" className="input" defaultValue={editOpp?.cliente} required />
                                        </div>
                                        <div className="mb">
                                            <label className="label">Comune *</label>
                                            <input name="comune" className="input" defaultValue={editOpp?.comune} required />
                                        </div>
                                    </div>

                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Tipologia Cliente *</label>
                                            <select name="tipologiaCliente" className="input" defaultValue={editOpp?.tipologiaCliente} required>
                                                {TIPOLOGIE_CLIENTE.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                        </div>
                                        <div className="mb">
                                            <label className="label">Tipologia Intervento *</label>
                                            <select name="tipologiaIntervento" className="input" defaultValue={editOpp?.tipologiaIntervento} required>
                                                {Object.entries(TIPOLOGIE_INTERVENTO).map(([k, v]) => (
                                                    <option key={k} value={k}>{v.label}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="mb">
                                        <label className="label">Descrizione Intervento</label>
                                        <textarea name="descrizioneIntervento" className="input" defaultValue={editOpp?.descrizioneIntervento} />
                                    </div>

                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Tipo Intervento</label>
                                            <select name="tipoIntervento" className="input" defaultValue={editOpp?.tipoIntervento || TIPO_INTERVENTO[0]}>
                                                {TIPO_INTERVENTO.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                        </div>
                                        <div className="mb">
                                            <label className="label">Importo Presunto (€)</label>
                                            <input type="number" name="importoPresunto" className="input" defaultValue={editOpp?.importoPresunto} />
                                        </div>
                                    </div>

                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Stato *</label>
                                            <select name="stato" className="input" defaultValue={editOpp?.stato || 'CALDA'} required>
                                                {STATI.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div className="mb">
                                            <label className="label">Possibile Contrattualizzazione</label>
                                            <select name="possibileContrattualizzazione" className="input" defaultValue={editOpp?.possibileContrattualizzazione || CONTRATTUALIZZAZIONE[0]}>
                                                {CONTRATTUALIZZAZIONE.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div style={{display: 'flex', gap: '10px', marginTop: '24px'}}>
                                        <button type="submit" className="btn btn-green">Salva</button>
                                        <button type="button" className="btn btn-white" onClick={() => { setShowForm(false); setEditOpp(null); }}>Annulla</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showUserForm && user.role === 'admin' && (
                        <div className="modal" onClick={() => { setShowUserForm(false); setEditUser(null); }}>
                            <div className="modal-content" style={{maxWidth: '800px'}} onClick={e => e.stopPropagation()}>
                                <h2 style={{marginBottom: '20px', color: '#2E7D32'}}>👥 Gestione Utenti</h2>
                                
                                <div className="card">
                                    <h3 style={{marginBottom: '16px'}}>{editUser ? 'Modifica' : 'Nuovo'} Utente</h3>
                                    <form onSubmit={saveUser}>
                                        <div className="grid-2">
                                            <div className="mb">
                                                <label className="label">Nome *</label>
                                                <input className="input" value={userForm.name} onChange={e => setUserForm({...userForm, name: e.target.value})} required />
                                            </div>
                                            <div className="mb">
                                                <label className="label">Username *</label>
                                                <input className="input" value={userForm.username} onChange={e => setUserForm({...userForm, username: e.target.value})} required />
                                            </div>
                                        </div>
                                        <div className="grid-2">
                                            <div className="mb">
                                                <label className="label">Password *</label>
                                                <input type="password" className="input" value={userForm.password} onChange={e => setUserForm({...userForm, password: e.target.value})} required />
                                            </div>
                                            <div className="mb">
                                                <label className="label">Ruolo *</label>
                                                <select className="input" value={userForm.role} onChange={e => setUserForm({...userForm, role: e.target.value})} required>
                                                    {Object.entries(RUOLI).map(([k, v]) => (
                                                        <option key={k} value={k}>{v}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                        <div style={{display: 'flex', gap: '10px'}}>
                                            <button type="submit" className="btn btn-green">Salva</button>
                                            {editUser && (
                                                <button type="button" className="btn btn-white" onClick={() => {
                                                    setEditUser(null);
                                                    setUserForm({ username: '', password: '', name: '', role: 'agenzia' });
                                                }}>Annulla</button>
                                            )}
                                        </div>
                                    </form>
                                </div>

                                <div className="card" style={{marginTop: '20px'}}>
                                    <h3 style={{marginBottom: '16px'}}>Utenti Esistenti ({users.length})</h3>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Nome</th>
                                                <th>Username</th>
                                                <th>Ruolo</th>
                                                <th>Azioni</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {users.map(u => (
                                                <tr key={u.uid}>
                                                    <td>{u.name}</td>
                                                    <td>{u.username}</td>
                                                    <td>{RUOLI[u.role]}</td>
                                                    <td>
                                                        <button 
                                                            className="btn btn-white" 
                                                            style={{padding: '6px 12px', marginRight: '4px'}}
                                                            onClick={() => {
                                                                setEditUser(u);
                                                                setUserForm({
                                                                    name: u.name,
                                                                    username: u.username,
                                                                    password: u.password,
                                                                    role: u.role
                                                                });
                                                            }}
                                                        >
                                                            ✏️
                                                        </button>
                                                        {u.uid !== user.uid && (
                                                            <button 
                                                                className="btn btn-red" 
                                                                style={{padding: '6px 12px'}}
                                                                onClick={() => deleteUser(u.uid)}
                                                            >
                                                                🗑️
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <button className="btn btn-white" style={{marginTop: '20px'}} onClick={() => setShowUserForm(false)}>
                                    Chiudi
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        window.addEventListener('error', (event) => {
            console.error('❌ Errore globale:', event.error);
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('❌ Promise non gestita:', event.reason);
        });

        try {
            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch (error) {
            console.error('❌ Errore render React:', error);
            document.getElementById('root').innerHTML = `
                <div class="error-screen">
                    <div class="error-card">
                        <h2>❌ Errore Rendering</h2>
                        <p>${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
