            useEffect(() => {
                const savedUsername = localStorage.getItem('savedUsername');
                const savedPassword = localStorage.getItem('savedPassword');
                if (savedUsername && savedPassword) {

                }
            }, []);

            const generateCaptcha = () => {
                console.log('=== GENERATING CAPTCHA ===');
                
                // Scegli categoria random
                const categories = Object.keys(CAPTCHA_CATEGORIES);
                const randomCategory = categories[Math.floor(Math.random() * categories.length)];
                const categoryIcons = CAPTCHA_CATEGORIES[randomCategory];
                
                console.log('Selected category:', randomCategory);
                
                // Scegli 2-3 target corretti
                const numTargets = 2 + Math.floor(Math.random() * 2); // 2 o 3
                const shuffled = [...categoryIcons].sort(() => Math.random() - 0.5);
                const targets = shuffled.slice(0, numTargets);
                
                console.log('Number of targets:', numTargets);
                console.log('Target icons:', targets);
                
                // Altre categorie per distrazione
                const otherCategories = categories.filter(c => c !== randomCategory);
                const distractors = [];
                otherCategories.forEach(cat => {
                    const icons = CAPTCHA_CATEGORIES[cat];
                    const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                    distractors.push(randomIcon);
                });
                
                // Mix: targets + distractor (totale 9 immagini)
                const allImages = [...targets, ...distractors];
                while (allImages.length < 9) {
                    const randomCat = categories[Math.floor(Math.random() * categories.length)];
                    const randomIcon = CAPTCHA_CATEGORIES[randomCat][Math.floor(Math.random() * CAPTCHA_CATEGORIES[randomCat].length)];
                    if (!allImages.includes(randomIcon)) {
                        allImages.push(randomIcon);
                    }
                }
                
                // Shuffle finale
                const finalImages = allImages.sort(() => Math.random() - 0.5).slice(0, 9);
                
                console.log('Final grid images:', finalImages);
                
                setCaptchaImages(finalImages);
                setCaptchaTarget(randomCategory);
                setSelectedImages([]);
            };

                        const usersSnapshot = await db.ref('users').once('value');

                        if (!existingUsers || Object.keys(existingUsers).length === 0) {

                        });

                e.preventDefault();

                const found = users.find(u => u.username === login.username && u.password === login.password);
                
                if (found) {
                    // LOGIN DIRETTO
                    if (login.remember) {
                        localStorage.setItem('savedUsername', login.username);
                        localStorage.setItem('savedPassword', login.password);
                    } else {
                        localStorage.removeItem('savedUsername');
                        localStorage.removeItem('savedPassword');
                    }
                    
                    setUser(found);
                    setShowLogin(false);
                } else {

                const noWrongSelected = selectedImages.every(img => correctImages.includes(img));

                console.log('All correct selected:', allCorrectSelected);
                console.log('No wrong selected:', noWrongSelected);
                console.log('Right count:', rightCount);

                    if (login.remember) {

                    generateCaptcha(); // Genera nuovo CAPTCHA

                                                            <td style={{textAlign: 'center'}}>€{clientOpps.filter(o => o.stato === 'TIEPIDA').reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                            <td style={{textAlign: 'center'}}>€{clientOpps.filter(o => o.stato === 'FREDDA').reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                            <td style={{textAlign: 'center'}}>€{clientOpps.filter(o => o.stato === 'KO').reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                            <td style={{textAlign: 'center'}}>€{clientOpps.filter(o => o.stato === 'OK').reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                            <td></td>
                                                            <td style={{textAlign: 'right'}}>€{clientOpps.reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        );
                                    })
                                ) : (
                                    // CLIENT: Solo la propria tabella
                                    <div>
                                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px'}}>
                                            <h3 style={{color: '#2E7D32', fontSize: '16px', margin: 0}}>
                                                👤 {user.name}
                                            </h3>
                                            <button className="btn btn-white" style={{padding: '8px 16px'}} onClick={() => printSingleClientTable(user.id, user.name)}>
                                                🖨️ Stampa Tabella
                                            </button>
                                        </div>
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>Tipologia Intervento</th>
                                                    <th style={{textAlign: 'center'}}>CALDA</th>
                                                    <th style={{textAlign: 'center'}}>TIEPIDA</th>
                                                    <th style={{textAlign: 'center'}}>FREDDA</th>
                                                    <th style={{textAlign: 'center'}}>KO</th>
                                                    <th style={{textAlign: 'center'}}>OK</th>
                                                    <th style={{textAlign: 'center'}}>Totale</th>
                                                    <th style={{textAlign: 'right'}}>Importo Totale</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {Object.keys(TIPOLOGIE_INTERVENTO).map(tipKey => {
                                                    const oppsPerTipo = myOpps.filter(o => o.tipologiaIntervento === tipKey);
                                                    if (oppsPerTipo.length === 0) return null;
                                                    
                                                    const calda = oppsPerTipo.filter(o => o.stato === 'CALDA').length;
                                                    const tiepida = oppsPerTipo.filter(o => o.stato === 'TIEPIDA').length;
                                                    const fredda = oppsPerTipo.filter(o => o.stato === 'FREDDA').length;
                                                    const ko = oppsPerTipo.filter(o => o.stato === 'KO').length;
                                                    const ok = oppsPerTipo.filter(o => o.stato === 'OK').length;
                                                    const totale = oppsPerTipo.length;
                                                    const importoTotale = oppsPerTipo.reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0);
                                                    
                                                    return (
                                                        <tr key={tipKey}>
                                                            <td style={{fontWeight: '600'}}>{TIPOLOGIE_INTERVENTO[tipKey].label}</td>
                                                            <td style={{textAlign: 'center', background: '#FEF3C7'}}>{calda}</td>
                                                            <td style={{textAlign: 'center', background: '#FCE7F3'}}>{tiepida}</td>
                                                            <td style={{textAlign: 'center', background: '#DBEAFE'}}>{fredda}</td>
                                                            <td style={{textAlign: 'center', background: '#FEE2E2'}}>{ko}</td>
                                                            <td style={{textAlign: 'center', background: '#D1FAE5'}}>{ok}</td>
                                                            <td style={{textAlign: 'center', fontWeight: '700'}}>{totale}</td>
                                                            <td style={{textAlign: 'right', fontWeight: '700'}}>€{importoTotale.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                        </tr>
                                                    );
                                                })}
                                                <tr style={{background: '#81C784', fontWeight: '700'}}>
                                                    <td>TOTALE OPPORTUNITÀ</td>
                                                    <td style={{textAlign: 'center'}}>{myOpps.filter(o => o.stato === 'CALDA').length}</td>
                                                    <td style={{textAlign: 'center'}}>{myOpps.filter(o => o.stato === 'TIEPIDA').length}</td>
                                                    <td style={{textAlign: 'center'}}>{myOpps.filter(o => o.stato === 'FREDDA').length}</td>
                                                    <td style={{textAlign: 'center'}}>{myOpps.filter(o => o.stato === 'KO').length}</td>
                                                    <td style={{textAlign: 'center'}}>{myOpps.filter(o => o.stato === 'OK').length}</td>
                                                    <td style={{textAlign: 'center'}}>{myOpps.length}</td>
                                                    <td style={{textAlign: 'right'}}>€{myOpps.reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                </tr>
                                                <tr style={{background: '#2E7D32', color: 'white', fontWeight: '700'}}>
                                                    <td>TOTALE IMPORTI</td>
                                                    <td style={{textAlign: 'center'}}>€{myOpps.filter(o => o.stato === 'CALDA').reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                    <td style={{textAlign: 'center'}}>€{myOpps.filter(o => o.stato === 'TIEPIDA').reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                    <td style={{textAlign: 'center'}}>€{myOpps.filter(o => o.stato === 'FREDDA').reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                    <td style={{textAlign: 'center'}}>€{myOpps.filter(o => o.stato === 'KO').reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                    <td style={{textAlign: 'center'}}>€{myOpps.filter(o => o.stato === 'OK').reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                    <td></td>
                                                    <td style={{textAlign: 'right'}}>€{myOpps.reduce((sum, o) => sum + (parseInt(o.importoPresunto) || 0), 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {user.role === 'admin' && (
                            <>
                                <h2 style={{margin: '40px 0 16px', color: '#2E7D32'}}>👥 Gestione Utenti</h2>
                                <button className="btn btn-green" style={{marginBottom: '16px'}} onClick={() => setShowUserForm(true)}>+ Nuovo Utente</button>
                                
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Nome</th>
                                            <th>Username</th>
                                            <th>Ruolo</th>
                                            <th>Azioni</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {users.map(u => (
                                            <tr key={u.id}>
                                                <td style={{fontWeight: '600'}}>{u.name}</td>
                                                <td>{u.username}</td>
                                                <td>
                                                    <span className="badge" style={{
                                                        background: u.role === 'admin' ? '#2E7D32' : u.role === 'diretto' ? '#1976D2' : u.role === 'interno' ? '#F57C00' : '#81C784',
                                                        color: 'white'
                                                    }}>
                                                        {RUOLI[u.role]}
                                                    </span>
                                                </td>
                                                <td>
                                                    <button className="btn btn-white" style={{padding: '6px 12px', marginRight: '8px'}} onClick={() => { setEditUser(u); setUserForm({...u}); setShowUserForm(true); }}>Modifica</button>
                                                    <button className="btn btn-red" style={{padding: '6px 12px'}} onClick={() => deleteUser(u.id)}>Elimina</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </>
                        )}
                    </div>

                    {showForm && (
                        <div className="modal" onClick={() => { setShowForm(false); setEditOpp(null); }}>
                            <div className="modal-content" onClick={e => e.stopPropagation()}>
                                <h2 style={{marginBottom: '20px', color: '#2E7D32'}}>{editOpp ? 'Modifica' : 'Nuova'} Opportunità</h2>
                                <form onSubmit={saveOpp}>
                                    <div className="section-title">📋 Dati Azienda</div>
                                    <div className="mb">
                                        <label className="label">Ragione Sociale *</label>
                                        <input className="input" value={form.ragioneSociale} onChange={e => setForm({...form, ragioneSociale: e.target.value})} required />
                                    </div>
                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Indirizzo</label>
                                            <input className="input" value={form.indirizzo} onChange={e => setForm({...form, indirizzo: e.target.value})} />
                                        </div>
                                        <div className="mb">
                                            <label className="label">CAP</label>
                                            <input className="input" value={form.cap} onChange={e => setForm({...form, cap: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Città</label>
                                            <input className="input" value={form.citta} onChange={e => setForm({...form, citta: e.target.value})} />
                                        </div>
                                        <div className="mb">
                                            <label className="label">Telefono</label>
                                            <input className="input" value={form.telefono} onChange={e => setForm({...form, telefono: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="mb">
                                        <label className="label">Tipologia Cliente *</label>
                                        <select className="input" value={form.tipologiaCliente} onChange={e => setForm({...form, tipologiaCliente: e.target.value})} required>
                                            <option value="">Seleziona...</option>
                                            {TIPOLOGIE_CLIENTE.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                    </div>

                                    <div className="section-title">👤 Referente</div>
                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Nome Referente</label>
                                            <input className="input" value={form.nomeReferente} onChange={e => setForm({...form, nomeReferente: e.target.value})} />
                                        </div>
                                        <div className="mb">
                                            <label className="label">Ruolo</label>
                                            <input className="input" value={form.ruoloReferente} onChange={e => setForm({...form, ruoloReferente: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Telefono Referente</label>
                                            <input className="input" value={form.telReferente} onChange={e => setForm({...form, telReferente: e.target.value})} />
                                        </div>
                                        <div className="mb">
                                            <label className="label">Email Referente</label>
                                            <input type="email" className="input" value={form.emailReferente} onChange={e => setForm({...form, emailReferente: e.target.value})} />
                                        </div>
                                    </div>

                                    <div className="section-title">📍 Ubicazione Intervento</div>
                                    <div className="grid-3">
                                        <div className="mb">
                                            <label className="label">Via</label>
                                            <input className="input" value={form.viaIntervento} onChange={e => setForm({...form, viaIntervento: e.target.value})} />
                                        </div>
                                        <div className="mb">
                                            <label className="label">Numero</label>
                                            <input className="input" value={form.numeroIntervento} onChange={e => setForm({...form, numeroIntervento: e.target.value})} />
                                        </div>
                                        <div className="mb">
                                            <label className="label">CAP</label>
                                            <input className="input" value={form.capIntervento} onChange={e => setForm({...form, capIntervento: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="mb">
                                        <label className="label">Città Intervento</label>
                                        <input className="input" value={form.cittaIntervento} onChange={e => setForm({...form, cittaIntervento: e.target.value})} />
                                    </div>

                                    <div className="section-title">🔧 Tecnico Incaricato</div>
                                    <div className="mb">
                                        <label className="label">Tecnico Incaricato</label>
                                        <select className="input" value={form.hasTecnico} onChange={e => setForm({...form, hasTecnico: e.target.value})}>
                                            <option value="no">NO</option>
                                            <option value="si">SI</option>
                                        </select>
                                    </div>
                                    {form.hasTecnico === 'si' && (
                                        <>
                                            <div className="mb">
                                                <label className="label">Nome Studio Tecnico</label>
                                                <input className="input" value={form.nomeStudioTecnico} onChange={e => setForm({...form, nomeStudioTecnico: e.target.value})} />
                                            </div>
                                            <div className="grid-2">
                                                <div className="mb">
                                                    <label className="label">Referente Studio</label>
                                                    <input className="input" value={form.referenteStudio} onChange={e => setForm({...form, referenteStudio: e.target.value})} />
                                                </div>
                                                <div className="mb">
                                                    <label className="label">Indirizzo Studio</label>
                                                    <input className="input" value={form.indirizzoStudio} onChange={e => setForm({...form, indirizzoStudio: e.target.value})} />
                                                </div>
                                            </div>
                                            <div className="grid-2">
                                                <div className="mb">
                                                    <label className="label">Telefono Studio</label>
                                                    <input className="input" value={form.telefonoStudio} onChange={e => setForm({...form, telefonoStudio: e.target.value})} />
                                                </div>
                                                <div className="mb">
                                                    <label className="label">Email Studio</label>
                                                    <input type="email" className="input" value={form.emailStudio} onChange={e => setForm({...form, emailStudio: e.target.value})} />
                                                </div>
                                            </div>
                                        </>
                                    )}

                                    <div className="section-title">⚡ Intervento</div>
                                    <div className="mb">
                                        <label className="label">Tipologia Intervento *</label>
                                        <select className="input" value={form.tipologiaIntervento} onChange={e => setForm({...form, tipologiaIntervento: e.target.value, vociSelezionate: []})} required>
                                            <option value="">Seleziona...</option>
                                            {Object.keys(TIPOLOGIE_INTERVENTO).map(k => <option key={k} value={k}>{TIPOLOGIE_INTERVENTO[k].label}</option>)}
                                        </select>
                                    </div>

                                    {form.tipologiaIntervento && TIPOLOGIE_INTERVENTO[form.tipologiaIntervento].voci.length > 0 && (
                                        <div className="mb">
                                            <label className="label">Voci Intervento</label>
                                            <div className="checkbox-group">
                                                {TIPOLOGIE_INTERVENTO[form.tipologiaIntervento].voci.map(voce => (
                                                    <label key={voce} className="checkbox-item">
                                                        <input type="checkbox" checked={form.vociSelezionate.includes(voce)} onChange={() => toggleVoce(voce)} />
                                                        <span>{voce}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {(form.tipologiaIntervento === 'cratere_2016' || form.tipologiaIntervento === 'cratere_2009') && (
                                        <div className="mb">
                                            <label className="label">Livello Operativo *</label>
                                            <select className="input" value={form.livelloOperativo} onChange={e => setForm({...form, livelloOperativo: e.target.value})} required>
                                                <option value="">Seleziona livello...</option>
                                                <option value="L0">L0</option>
                                                <option value="L1">L1</option>
                                                <option value="L2">L2</option>
                                                <option value="L3">L3</option>
                                                <option value="L4">L4</option>
                                            </select>
                                        </div>
                                    )}

                                    <div className="mb">
                                        <label className="label">Descrizione Intervento</label>
                                        <textarea className="input" value={form.descrizioneIntervento} onChange={e => setForm({...form, descrizioneIntervento: e.target.value})} />
                                    </div>

                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Tipo Intervento</label>
                                            <select className="input" value={form.tipoIntervento} onChange={e => setForm({...form, tipoIntervento: e.target.value})}>
                                                {TIPO_INTERVENTO.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                        </div>
                                        <div className="mb">
                                            <label className="label">Importo Presunto (€)</label>
                                            <input type="number" className="input" value={form.importoPresunto} onChange={e => setForm({...form, importoPresunto: e.target.value})} />
                                        </div>
                                    </div>

                                    <div className="grid-2">
                                        <div className="mb">
                                            <label className="label">Stato *</label>
                                            <select className="input" value={form.stato} onChange={e => setForm({...form, stato: e.target.value})} style={{
                                                background: form.stato === 'CALDA' ? '#FEF3C7' : form.stato === 'TIEPIDA' ? '#FCE7F3' : form.stato === 'FREDDA' ? '#DBEAFE' : form.stato === 'KO' ? '#FEE2E2' : '#D1FAE5',
                                                fontWeight: '700'
                                            }} required>
                                                <option value="CALDA" style={{background: '#FEF3C7'}}>CALDA</option>
                                                <option value="TIEPIDA" style={{background: '#FCE7F3'}}>TIEPIDA</option>
                                                <option value="FREDDA" style={{background: '#DBEAFE'}}>FREDDA</option>
                                                <option value="KO" style={{background: '#FEE2E2'}}>KO</option>
                                                <option value="OK" style={{background: '#D1FAE5'}}>OK</option>
                                            </select>
                                        </div>
                                        <div className="mb">
                                            <label className="label">Possibile Contrattualizzazione</label>
                                            <select className="input" value={form.possibileContrattualizzazione} onChange={e => setForm({...form, possibileContrattualizzazione: e.target.value})}>
                                                {CONTRATTUALIZZAZIONE.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div style={{display: 'flex', gap: '10px', marginTop: '24px'}}>
                                        <button type="submit" className="btn btn-green">Salva</button>
                                        <button type="button" className="btn btn-white" onClick={() => { setShowForm(false); setEditOpp(null); }}>Annulla</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showUserForm && user.role === 'admin' && (
                        <div className="modal" onClick={() => { setShowUserForm(false); setEditUser(null); }}>
                            <div className="modal-content" style={{maxWidth: '500px'}} onClick={e => e.stopPropagation()}>
                                <h2 style={{marginBottom: '20px', color: '#2E7D32'}}>{editUser ? 'Modifica' : 'Nuovo'} Utente</h2>
                                <form onSubmit={saveUser}>
                                    <div className="mb">
                                        <label className="label">Nome *</label>
                                        <input className="input" value={userForm.name} onChange={e => setUserForm({...userForm, name: e.target.value})} required />
                                    </div>
                                    <div className="mb">
                                        <label className="label">Username *</label>
                                        <input className="input" value={userForm.username} onChange={e => setUserForm({...userForm, username: e.target.value})} required />
                                    </div>
                                    <div className="mb">
                                        <label className="label">Password *</label>
                                        <input type="password" className="input" value={userForm.password} onChange={e => setUserForm({...userForm, password: e.target.value})} required />
                                    </div>
                                    <div className="mb">
                                        <label className="label">Ruolo *</label>
                                        <select className="input" value={userForm.role} onChange={e => setUserForm({...userForm, role: e.target.value})} required>
                                            <option value="agenzia">Agenzia</option>
                                            <option value="diretto">Diretto</option>
                                            <option value="interno">Interno</option>
                                            <option value="admin">Amministratore</option>
                                        </select>
                                    </div>
                                    <div style={{display: 'flex', gap: '10px'}}>
                                        <button type="submit" className="btn btn-green">Salva</button>
                                        <button type="button" className="btn btn-white" onClick={() => { setShowUserForm(false); setEditUser(null); }}>Annulla</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showDescModal && (
                        <div className="modal" onClick={() => setShowDescModal(false)}>
                            <div className="modal-content" style={{maxWidth: '600px'}} onClick={e => e.stopPropagation()}>
                                <h2 style={{marginBottom: '20px', color: '#2E7D32'}}>📄 Descrizione Intervento</h2>
                                <div style={{padding: '20px', background: '#f9f9f9', borderRadius: '8px', lineHeight: '1.6', whiteSpace: 'pre-wrap'}}>
                                    {selectedDesc}
                                </div>
                                <button className="btn btn-white" style={{marginTop: '20px'}} onClick={() => setShowDescModal(false)}>Chiudi</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
