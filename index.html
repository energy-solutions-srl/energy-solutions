<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Solutions - Edison Business Partner</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f9f4; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-white { background: white; color: #4CAF50; border: 2px solid #4CAF50; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; }
        .input:focus { outline: none; border-color: #4CAF50; }
        .label { display: block; margin-bottom: 6px; font-weight: 600; }
        .mb { margin-bottom: 16px; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f0f9f4 0%, #c8e6c9 100%); }
        .login-card { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(76, 175, 80, 0.3); padding: 40px; max-width: 400px; width: 100%; }
        .logo { background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%); padding: 20px; border-radius: 12px; color: white; text-align: center; margin-bottom: 24px; }
        .header { background: white; border-bottom: 3px solid #4CAF50; padding: 16px; margin-bottom: 24px; }
        .loading { text-align: center; padding: 60px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyAPdXkLXzz4zjScQX3_buEXGi2OytRfH2o",
            authDomain: "bu-progetti-speciali.firebaseapp.com",
            databaseURL: "https://bu-progetti-speciali-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bu-progetti-speciali",
            storageBucket: "bu-progetti-speciali.firebasestorage.app",
            messagingSenderId: "86623187511",
            appId: "1:86623187511:web:2a093d51719b458b4ec5b2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const { useState, useEffect } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [users, setUsers] = useState([]);
            const [opps, setOpps] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showLogin, setShowLogin] = useState(true);
            const [showForm, setShowForm] = useState(false);
            const [login, setLogin] = useState({ username: '', password: '' });
            const [form, setForm] = useState({ 
                ragioneSociale: '', 
                importo: '', 
                stato: 'CALDA' 
            });

            useEffect(() => {
                // Carica utenti
                db.ref('users').on('value', snap => {
                    const data = snap.val();
                    if (data) {
                        setUsers(Object.keys(data).map(k => ({ id: k, ...data[k] })));
                    } else {
                        // Crea utenti default
                        db.ref('users').set({
                            'user1': { 
                                username: 'admin', 
                                password: 'admin123', 
                                role: 'admin', 
                                name: 'Amministratore' 
                            },
                            'user2': { 
                                username: 'agenzia1', 
                                password: 'ag123', 
                                role: 'client', 
                                name: 'Agenzia Roma' 
                            }
                        });
                    }
                    setLoading(false);
                });

                // Carica opportunità
                db.ref('opportunities').on('value', snap => {
                    const data = snap.val();
                    if (data) {
                        setOpps(Object.keys(data).map(k => ({ id: k, ...data[k] })));
                    }
                });

                return () => {
                    db.ref('users').off();
                    db.ref('opportunities').off();
                };
            }, []);

            const doLogin = (e) => {
                e.preventDefault();
                const found = users.find(u => 
                    u.username === login.username && 
                    u.password === login.password
                );
                if (found) {
                    setUser(found);
                    setShowLogin(false);
                } else {
                    alert('Credenziali errate!');
                }
            };

            const saveOpp = async (e) => {
                e.preventDefault();
                const newOpp = {
                    ...form,
                    agenzia: user.name,
                    clientId: user.id,
                    createdAt: new Date().toISOString()
                };
                
                await db.ref('opportunities').push(newOpp);
                setShowForm(false);
                setForm({ ragioneSociale: '', importo: '', stato: 'CALDA' });
            };

            const deleteOpp = async (id) => {
                if (confirm('Eliminare?')) {
                    await db.ref('opportunities/' + id).remove();
                }
            };

            if (loading) {
                return <div className="loading">⏳ Caricamento...</div>;
            }

            if (showLogin) {
                return (
                    <div className="login-container">
                        <div className="login-card">
                            <div className="logo">
                                <h2>ENERGY SOLUTIONS</h2>
                                <p>Edison Business Partner</p>
                            </div>
                            <form onSubmit={doLogin}>
                                <div className="mb">
                                    <label className="label">Username</label>
                                    <input 
                                        className="input" 
                                        value={login.username}
                                        onChange={e => setLogin({...login, username: e.target.value})}
                                        required 
                                    />
                                </div>
                                <div className="mb">
                                    <label className="label">Password</label>
                                    <input 
                                        type="password"
                                        className="input" 
                                        value={login.password}
                                        onChange={e => setLogin({...login, password: e.target.value})}
                                        required 
                                    />
                                </div>
                                <button type="submit" className="btn btn-green" style={{width: '100%'}}>
                                    Accedi
                                </button>
                            </form>
                            <div style={{marginTop: '20px', padding: '15px', background: '#f0f9f4', borderRadius: '8px', fontSize: '13px'}}>
                                <strong>Credenziali:</strong><br/>
                                Admin: admin / admin123<br/>
                                Agenzia: agenzia1 / ag123
                            </div>
                        </div>
                    </div>
                );
            }

            const myOpps = user.role === 'admin' ? opps : opps.filter(o => o.clientId === user.id);

            return (
                <div style={{minHeight: '100vh'}}>
                    <div className="header">
                        <div className="container" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                            <div>
                                <h1 style={{fontSize: '20px', color: '#2E7D32'}}>Energy Solutions</h1>
                                <p style={{fontSize: '14px', color: '#666'}}>{user.name}</p>
                            </div>
                            <button className="btn btn-white" onClick={() => { setUser(null); setShowLogin(true); }}>
                                Esci
                            </button>
                        </div>
                    </div>

                    <div className="container">
                        <div style={{marginBottom: '20px'}}>
                            <button className="btn btn-green" onClick={() => setShowForm(true)}>
                                + Nuova Opportunità
                            </button>
                        </div>

                        {showForm && (
                            <div className="card">
                                <h2 style={{marginBottom: '20px'}}>Nuova Opportunità</h2>
                                <form onSubmit={saveOpp}>
                                    <div className="mb">
                                        <label className="label">Ragione Sociale *</label>
                                        <input 
                                            className="input"
                                            value={form.ragioneSociale}
                                            onChange={e => setForm({...form, ragioneSociale: e.target.value})}
                                            required
                                        />
                                    </div>
                                    <div className="mb">
                                        <label className="label">Importo Presunto €</label>
                                        <input 
                                            type="number"
                                            className="input"
                                            value={form.importo}
                                            onChange={e => setForm({...form, importo: e.target.value})}
                                        />
                                    </div>
                                    <div className="mb">
                                        <label className="label">Stato</label>
                                        <select 
                                            className="input"
                                            value={form.stato}
                                            onChange={e => setForm({...form, stato: e.target.value})}
                                        >
                                            <option>CALDA</option>
                                            <option>FREDDA</option>
                                            <option>KO</option>
                                            <option>OK</option>
                                        </select>
                                    </div>
                                    <div style={{display: 'flex', gap: '10px'}}>
                                        <button type="submit" className="btn btn-green">Salva</button>
                                        <button type="button" className="btn btn-white" onClick={() => setShowForm(false)}>Annulla</button>
                                    </div>
                                </form>
                            </div>
                        )}

                        <h2 style={{marginBottom: '16px'}}>Le Mie Opportunità ({myOpps.length})</h2>
                        
                        {myOpps.length === 0 && (
                            <div className="card">
                                <p style={{textAlign: 'center', color: '#666'}}>
                                    Nessuna opportunità. Clicca "+ Nuova Opportunità" per iniziare!
                                </p>
                            </div>
                        )}

                        {myOpps.map(o => (
                            <div className="card" key={o.id}>
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'start'}}>
                                    <div>
                                        <h3 style={{marginBottom: '8px'}}>{o.ragioneSociale}</h3>
                                        <p style={{color: '#666', marginBottom: '8px'}}>
                                            Importo: €{o.importo || '0'} | Stato: <strong>{o.stato}</strong>
                                        </p>
                                        <p style={{fontSize: '13px', color: '#999'}}>
                                            {new Date(o.createdAt).toLocaleString('it-IT')}
                                        </p>
                                    </div>
                                    {user.role === 'admin' && (
                                        <button 
                                            className="btn btn-white"
                                            style={{padding: '8px 16px'}}
                                            onClick={() => deleteOpp(o.id)}
                                        >
                                            Elimina
                                        </button>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
